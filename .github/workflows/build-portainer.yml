name: Build Portainer CE

on:
  push:
    branches:
      - snc-develop
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/steve-n-com/portainer-ce

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
      
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Portainer from source
        env:
          PLATFORM: linux
          ARCH: ${{ matrix.arch }}
          SKIP_GO_GET: "true"
        run: |
          make ENV=production tidy build-server build-client build-storybook

      - name: Set build timestamp
        id: buildmeta
        run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/linux/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.buildmeta.outputs.build_date }}
          cache-from: type=gha,scope=portainer-ce-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=portainer-ce-${{ matrix.arch }}

  publish-multiarch:
    name: Publish multi-platform tags
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Create multi-platform image tags
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          GIT_SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:${{ steps.extract_branch.outputs.branch }}" \
            --tag "$IMAGE:sha-$GIT_SHA" \
            "$IMAGE:sha-$GIT_SHA-amd64" \
            "$IMAGE:sha-$GIT_SHA-arm64"
